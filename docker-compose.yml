version: '3.8'

services:
  design-system-generator:
    build: .
    container_name: design-system-generator
    ports:
      - "5173:5173"
    volumes:
      # Mount source code for hot reload during development
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      # Prevent overwriting node_modules
      - /app/node_modules
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true
